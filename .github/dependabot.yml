# Dependabot version updates
# 運用方針は docs/security-updates.md を参照
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "environment"
      - "dependencies"
    groups:
      # パッチ・マイナー更新は1本のPRにまとめてレビュー負荷を下げる
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # メジャー更新は Issue #293 で影響調査のうえ計画的に実施する
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "environment"
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
