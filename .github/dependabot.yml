# Dependabot version updates
# オープン中の Dependabot PR は毎週 Slack に通知される（.github/workflows/dependabot-slack-notification.yml）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "environment"
    groups:
      # パッチ・マイナー更新は1本のPRにまとめてレビュー負荷を下げる
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # メジャー更新は Issue #293 で影響調査のうえ計画的に実施する
      # eslint は flat config への移行（Next.js 16 対応）とセットで実施する
      # @types/node は実行環境の Node.js 22 に合わせる
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "environment"
    groups:
      actions:
        patterns:
          - "*"
