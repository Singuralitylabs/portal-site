name: Dependabot Slack Notification

# オープン中の Dependabot PR を週1回 Slack へ通知し、更新PRの見落としを防ぐ。
# Dependabot 起点の実行では通常の Secrets が渡らないため、PR 作成イベントではなく
# schedule 実行（通常の Secrets と GITHUB_TOKEN が使える）で一覧を取得して通知する。
on:
  schedule:
    # 毎週月曜 11:00 (JST)。dependabot.yml の更新（月曜 9:00 JST）の後に実行する。
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify open Dependabot pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dependabot-slack-notification.cjs
