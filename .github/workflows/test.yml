name: Jest Unit Tests

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "middleware.ts"
      - "jest.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "middleware.ts"
      - "jest.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ソースコード取得
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      # 依存関係インストール
      - name: Install dependencies
        run: npm ci

      # Jest 実行
      - name: Run Jest tests
        run: npm test
